<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- 外圆 -->
  <circle cx="60" cy="60" r="55" fill="url(#logoGradient)" stroke="#ffffff" stroke-width="2"/>
  
  <!-- 星星图案 -->
  <g transform="translate(60,60)">
    <!-- 主星星 -->
    <path d="M0,-25 L7.5,-7.5 L25,0 L7.5,7.5 L0,25 L-7.5,7.5 L-25,0 L-7.5,-7.5 Z" fill="#ffffff" opacity="0.9"/>
    
    <!-- 小星星装饰 -->
    <circle cx="-20" cy="-20" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="20" cy="-20" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="-20" cy="20" r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="20" cy="20" r="2" fill="#ffffff" opacity="0.7"/>
    
    <!-- 中心圆 -->
    <circle cx="0" cy="0" r="8" fill="#d4af37" stroke="#ffffff" stroke-width="1"/>
  </g>
  
  <!-- 文字 -->
  <text x="60" y="100" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#ffffff">MagicStar</text>
</svg>