<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <defs>
    <linearGradient id="loadingGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#8b5cf6;stop-opacity:0.5" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- 旋转的圆环 -->
  <circle cx="20" cy="20" r="15" fill="none" stroke="url(#loadingGradient)" stroke-width="3" stroke-linecap="round">
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="0 20 20"
      to="360 20 20"
      dur="1s"
      repeatCount="indefinite"/>
  </circle>
  
  <!-- 中心点 -->
  <circle cx="20" cy="20" r="2" fill="#6366f1">
    <animate attributeName="opacity" values="1;0.3;1" dur="1s" repeatCount="indefinite"/>
  </circle>
  
  <!-- 装饰点 -->
  <g>
    <circle cx="20" cy="5" r="1.5" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="35" cy="20" r="1.5" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.25s" repeatCount="indefinite"/>
    </circle>
    <circle cx="20" cy="35" r="1.5" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="5" cy="20" r="1.5" fill="#8b5cf6">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="1s" begin="0.75s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>