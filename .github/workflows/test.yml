name: Automated Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # 每天凌晨2点运行完整测试套件
    - cron: '0 2 * * *'

env:
  NODE_VERSION: '18'

jobs:
  # 单元测试
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        project: [backend, frontend]
        node-version: [16, 18, 20]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: magicstar-${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: |
          cd magicstar-${{ matrix.project }}
          npm ci

      - name: Run unit tests
        run: |
          cd magicstar-${{ matrix.project }}
          npm run test:cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./magicstar-${{ matrix.project }}/coverage/lcov.info
          flags: ${{ matrix.project }}-unit
          name: ${{ matrix.project }}-unit-${{ matrix.node-version }}

  # 集成测试
  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123
          MYSQL_DATABASE: magicstar_test
          MYSQL_USER: magicstar
          MYSQL_PASSWORD: magicstar123
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
      
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd="redis-cli ping" --health-interval=10s --health-timeout=5s --health-retries=3
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: magicstar-backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd magicstar-backend
          npm ci

      - name: Wait for services
        run: |
          sleep 10
          # 验证MySQL连接
          mysql -h 127.0.0.1 -P 3306 -u magicstar -pmagicstar123 -e "SELECT 1"
          # 验证Redis连接
          redis-cli -h 127.0.0.1 -p 6379 ping

      - name: Run database migrations
        run: |
          cd magicstar-backend
          # 这里添加数据库迁移命令
          # npm run migration:run
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: magicstar
          DB_PASSWORD: magicstar123
          DB_DATABASE: magicstar_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379

      - name: Run integration tests
        run: |
          cd magicstar-backend
          npm run test:e2e
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: magicstar
          DB_PASSWORD: magicstar123
          DB_DATABASE: magicstar_test
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: 6379
          JWT_SECRET: test-jwt-secret

      - name: Upload integration test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-results
          path: magicstar-backend/test-results/

  # E2E测试
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          cd magicstar-frontend
          npm ci

      - name: Install Playwright
        run: |
          cd magicstar-frontend
          npx playwright install --with-deps

      - name: Start services with Docker Compose
        run: |
          docker-compose -f docker-compose.dev.yml up -d
          # 等待服务启动
          sleep 30

      - name: Wait for services to be ready
        run: |
          # 等待后端服务
          timeout 60 bash -c 'until curl -f http://localhost:3001/health; do sleep 2; done'
          # 等待前端服务（如果有的话）
          # timeout 60 bash -c 'until curl -f http://localhost:3000; do sleep 2; done'

      - name: Run E2E tests
        run: |
          cd magicstar-frontend
          npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:3001

      - name: Upload E2E test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: e2e-test-results
          path: |
            magicstar-frontend/test-results/
            magicstar-frontend/playwright-report/

      - name: Stop services
        if: always()
        run: |
          docker-compose -f docker-compose.dev.yml down

  # 性能测试
  performance-tests:
    name: Performance Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[perf-test]')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install k6
        run: |
          sudo gpg -k
          sudo gpg --no-default-keyring --keyring /usr/share/keyrings/k6-archive-keyring.gpg --keyserver hkp://keyserver.ubuntu.com:80 --recv-keys C5AD17C747E3415A3642D57D77C6C491D6AC1D69
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install k6

      - name: Start services
        run: |
          docker-compose -f docker-compose.dev.yml up -d
          sleep 30

      - name: Run performance tests
        run: |
          # 创建简单的k6测试脚本
          cat > perf-test.js << 'EOF'
          import http from 'k6/http';
          import { check, sleep } from 'k6';
          
          export let options = {
            stages: [
              { duration: '30s', target: 10 },
              { duration: '1m', target: 50 },
              { duration: '30s', target: 0 },
            ],
          };
          
          export default function () {
            let response = http.get('http://localhost:3001/health');
            check(response, {
              'status is 200': (r) => r.status === 200,
              'response time < 500ms': (r) => r.timings.duration < 500,
            });
            sleep(1);
          }
          EOF
          
          k6 run --out json=perf-results.json perf-test.js

      - name: Upload performance test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: performance-test-results
          path: perf-results.json

      - name: Stop services
        if: always()
        run: |
          docker-compose -f docker-compose.dev.yml down

  # 测试报告汇总
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, e2e-tests]
    if: always()
    
    steps:
      - name: Download all test artifacts
        uses: actions/download-artifact@v3

      - name: Generate test summary
        run: |
          echo "# Test Summary" > test-summary.md
          echo "" >> test-summary.md
          echo "## Unit Tests" >> test-summary.md
          echo "Status: ${{ needs.unit-tests.result }}" >> test-summary.md
          echo "" >> test-summary.md
          echo "## Integration Tests" >> test-summary.md
          echo "Status: ${{ needs.integration-tests.result }}" >> test-summary.md
          echo "" >> test-summary.md
          echo "## E2E Tests" >> test-summary.md
          echo "Status: ${{ needs.e2e-tests.result }}" >> test-summary.md

      - name: Comment PR with test summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v6
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('test-summary.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });